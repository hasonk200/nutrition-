<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>食物營養分類速查表</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme: light;
  --bg:#f2f5f9;--card:#fff;--text:#243342;--muted:#6b7c8c;--border:#e2e8f0;
  --accent:#0e7490;--thead:#f0f4f8;--zebra:rgba(0,0,0,.035);--hover:rgba(0,0,0,.06);
  --starch:#8a6d3b;--fiber:#2f7d32;--protein:#c0392b;--gi:#1d6fb8;--calc:#7d3c98;
  --iron:#a04000;--vc:#e67e22;--fat:#b8860b;--light:#00838f;
}
body.dark{
  color-scheme: dark;
  --bg:#151a20;--card:#1e262e;--text:#e6ecf1;--muted:#9db0bd;--border:#313d49;
  --accent:#38bdf8;--thead:#27313b;--zebra:rgba(255,255,255,.05);--hover:rgba(255,255,255,.09);
  --starch:#c9a86a;--fiber:#6cc06c;--protein:#f0876f;--gi:#6cb2f0;--calc:#c39bd3;
  --iron:#e8965a;--vc:#f5a45c;--fat:#e0c050;--light:#4fc3dd;
}
body{font-family:"Noto Sans TC","Noto Sans SC","PingFang TC","PingFang SC","Microsoft JhengHei","Microsoft YaHei",system-ui,sans-serif;
font-size:13.5px;background:var(--bg);color:var(--text);line-height:1.55}
html{scroll-behavior:smooth}
section{scroll-margin-top:10px}

/* ── 雙欄版面 ── */
.wrap{max-width:1460px;margin:0 auto;padding:16px 18px 60px;display:grid;
grid-template-columns:minmax(0,1fr) 296px;gap:16px;
grid-template-areas:"hero hero" "main panel" "foot foot"}
.hero{grid-area:hero;display:flex;justify-content:space-between;align-items:flex-start;
gap:10px;flex-wrap:wrap}
h1{font-size:clamp(18px,2.4vw,24px)}
.subtitle{color:var(--muted);font-size:12.5px;margin-top:2px}
.hero-actions{display:flex;gap:8px;align-items:center;flex:none}
.lang-seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;
background:var(--card)}
.lang-seg button{border:none;background:transparent;color:var(--muted);
padding:4px 11px;font-size:12px;cursor:pointer;font-family:inherit}
.lang-seg button:hover{color:var(--text)}
.lang-seg button.on{background:var(--accent);color:#fff}
body.dark .lang-seg button.on{color:#141b20}
.theme-btn{border:1px solid var(--border);background:var(--card);color:var(--text);
border-radius:8px;padding:4px 10px;cursor:pointer;font-size:14px}
.theme-btn:hover{border-color:var(--accent)}

#panel{grid-area:panel;position:sticky;top:16px;align-self:start;
max-height:calc(100vh - 32px);overflow-y:auto;background:var(--card);
border:1px solid var(--border);border-radius:12px;padding:12px 12px 10px;
box-shadow:0 1px 3px rgba(0,0,0,.05)}
.p-title{font-weight:700;font-size:14px;margin-bottom:8px}
.p-label{font-size:11.5px;color:var(--muted);margin:10px 0 5px;font-weight:600}
.searchbox{position:relative}
.searchbox input{width:100%;padding:7px 10px 7px 30px;border-radius:8px;
border:1px solid var(--border);background:var(--bg);color:var(--text);
font-size:13px;outline:none;font-family:inherit}
.searchbox input:focus{border-color:var(--accent)}
.searchbox::before{content:'🔍';position:absolute;left:8px;top:50%;
transform:translateY(-50%);font-size:11px;opacity:.7;pointer-events:none}
.p-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.count{font-size:11.5px;color:var(--muted)}
#reset{border:1px solid var(--border);background:transparent;color:var(--muted);
border-radius:6px;padding:3px 9px;cursor:pointer;font-size:11.5px;font-family:inherit}
#reset:hover{color:var(--text);border-color:var(--accent)}

.fbar{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.fbtn{display:flex;justify-content:space-between;align-items:center;gap:4px;
padding:5px 8px;border:1px solid var(--border);border-radius:8px;
background:var(--card);color:var(--text);cursor:pointer;font-size:12px;font-family:inherit}
.fbtn:hover{border-color:var(--c)}
.fbtn.on{background:var(--c);border-color:var(--c);color:#fff}
.fbtn .cnt{font-size:10.5px;opacity:.7}
body.dark .fbtn.on{color:#141b20}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:none;background:var(--card);color:var(--muted);
padding:5px 4px;font-size:11.5px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--accent);color:#fff}
body.dark .seg button.on{color:#141b20}
select#sort{width:100%;padding:5px 6px;border-radius:8px;border:1px solid var(--border);
background:var(--card);color:var(--text);font-size:12px;font-family:inherit;cursor:pointer}
.hint{font-size:11px;color:var(--muted);margin-top:8px}
kbd{border:1px solid var(--border);border-radius:3px;padding:0 3px;font-size:10px;
background:var(--thead);font-family:inherit}
.mini-nav{display:flex;flex-wrap:wrap;gap:4px}
.mini-nav a{font-size:11.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--border);
color:var(--muted);text-decoration:none}
.mini-nav a:hover{color:var(--accent);border-color:var(--accent)}

#mainCol{grid-area:main;min-width:0}
section.card{background:var(--card);border:1px solid var(--border);border-radius:12px;
padding:13px 14px 9px;margin-top:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
section h2{display:flex;align-items:center;gap:8px;font-size:15.5px}
section h2::before{content:'';width:10px;height:10px;border-radius:50%;
background:var(--c,#888);flex:none}
h2 .num{margin-left:auto;font-size:11.5px;font-weight:400;color:var(--muted)}
.sec-note{color:var(--muted);font-size:12px;margin:3px 0 9px}
#results{--c:var(--accent)}
#sec-starch{--c:var(--starch)}#sec-fiber{--c:var(--fiber)}#sec-protein{--c:var(--protein)}
#sec-gi{--c:var(--gi)}#sec-calc{--c:var(--calc)}#sec-iron{--c:var(--iron)}
#sec-vc{--c:var(--vc)}#sec-fat{--c:var(--fat)}#sec-light{--c:var(--light)}

.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:660px;font-size:12.6px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
thead th{background:var(--thead);color:var(--muted);font-size:11.5px;font-weight:600;white-space:nowrap}
tbody tr:nth-child(even){background:var(--zebra)}
tbody tr:hover{background:var(--hover)}
.food-name{font-weight:600;white-space:nowrap}
mark{background:rgba(14,116,144,.18);color:inherit;border-radius:3px;padding:0 2px}
body.dark mark{background:rgba(56,189,248,.25)}

/* ── 營養小方塊 ── */
.nutri{display:flex;flex-wrap:wrap;gap:4px;max-width:400px;align-items:stretch}
.perml{display:inline-flex;align-items:center;font-size:9.5px;color:var(--muted);
border:1px dashed var(--border);border-radius:5px;padding:1px 5px;white-space:nowrap}
.nb{display:flex;flex-direction:column;align-items:center;justify-content:center;
min-width:58px;padding:3px 7px;background:var(--thead);
border:1px solid var(--border);border-radius:7px;line-height:1.35;text-align:center}
.nb i{font-style:normal;font-size:9.5px;color:var(--muted);white-space:nowrap;display:block}
.nb b{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.nb b u{text-decoration:none;font-size:9px;font-weight:400;color:var(--muted);margin-left:1px}
.nb.kcal{border-color:var(--c,#888)}
.nb.kcal b{color:var(--c,#888);font-size:13.5px}
.nb.ex{border-style:dashed}

.chip{display:inline-block;padding:0 7px;border-radius:99px;font-size:11px;
line-height:1.7;color:#fff;background:var(--c,#888);margin:1px 3px 1px 0;white-space:nowrap}
.chip.sub{background:transparent;border:1px solid var(--c,#888);color:var(--c,#888)}
body.dark .chip:not(.sub){color:#141b20}
body.dark .chip.sub{color:var(--c,#888)}
.c-starch{--c:var(--starch)}.c-fiber{--c:var(--fiber)}.c-protein{--c:var(--protein)}
.c-gi{--c:var(--gi)}.c-calc{--c:var(--calc)}.c-iron{--c:var(--iron)}
.c-vc{--c:var(--vc)}.c-fat{--c:var(--fat)}.c-light{--c:var(--light)}
.empty{padding:22px 10px;text-align:center;color:var(--muted)}
.empty button{margin-top:8px;border:1px solid var(--accent);color:var(--accent);
border-radius:8px;padding:5px 12px;background:transparent;cursor:pointer;
font-family:inherit;font-size:12.5px}
.empty button:hover{background:var(--accent);color:#fff}
body.dark .empty button:hover{color:#141b20}
.tips ul{list-style:none}
.tips li{padding:7px 0 7px 22px;position:relative;border-bottom:1px dashed var(--border);
font-size:12.5px}
.tips li::before{content:'✓';position:absolute;left:2px;color:var(--accent);font-weight:700}
footer.note{grid-area:foot;margin-top:16px;font-size:11.5px;color:var(--muted);
border-top:1px solid var(--border);padding-top:10px}
#totop{position:fixed;right:16px;bottom:16px;display:none;width:40px;height:40px;
border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);
font-size:16px;cursor:pointer;z-index:70;box-shadow:0 2px 8px rgba(0,0,0,.15)}

@media (max-width:1000px){
.wrap{grid-template-columns:1fr;grid-template-areas:"hero" "panel" "main" "foot"}
#panel{position:static;max-height:none}
.fbar{grid-template-columns:repeat(3,1fr)}
}
@media print{#panel,#totop,.theme-btn,.hint,.lang-seg{display:none}
.wrap{display:block;max-width:none} body{background:#fff;font-size:11px}}
</style>
</head>
<body>
<div class="wrap">

<header class="hero">
  <div>
    <h1 id="ptTitle">🥗 食物營養分類速查表</h1>
    <p class="subtitle" id="ptSub"></p>
  </div>
  <div class="hero-actions">
    <div class="lang-seg" id="langSeg">
      <button type="button" data-l="0" class="on" title="繁體中文">繁</button>
      <button type="button" data-l="1" title="简体中文">简</button>
      <button type="button" data-l="2" title="English">EN</button>
    </div>
    <button class="theme-btn" id="theme">🌙</button>
  </div>
</header>

<!-- ── 右側常駐篩選面板 ── -->
<aside id="panel">
  <div class="p-title" id="panelTitle">🎯 條件篩選</div>
  <div class="searchbox"><input id="q" type="search"></div>
  <div class="p-row"><span class="count" id="count"></span><button id="reset"></button></div>
  <div class="p-label" id="lblCat"></div>
  <div class="fbar" id="fbar"></div>
  <div class="p-label" id="lblMode"></div>
  <div class="seg">
    <button type="button" id="modeAnd" class="on"></button>
    <button type="button" id="modeOr"></button>
  </div>
  <div class="p-label" id="lblSort"></div>
  <select id="sort"></select>
  <p class="hint" id="hintTxt"></p>
  <div class="p-label" id="lblNav"></div>
  <nav class="mini-nav" id="pills"></nav>
</aside>

<!-- ── 左側主欄 ── -->
<main id="mainCol">

<section class="card" id="results" style="display:none">
  <h2><span id="resTitle">🎯 篩選結果</span><span class="num" id="resNum"></span></h2>
  <p class="sec-note" id="resDesc"></p>
  <div class="twrap" id="resTwrap"><table>
    <thead><tr><th id="resTh1"></th><th id="resTh2"></th><th id="resTh3"></th><th id="resTh4"></th></tr></thead>
    <tbody id="resBody"></tbody>
  </table></div>
  <div class="empty" id="empty" style="display:none">
    <p id="emptyTxt"></p>
    <button type="button" id="tryOr" style="display:none"></button>
  </div>
</section>

<section class="card" id="std">
  <h2 id="stdTitle"></h2>
  <p class="sec-note" id="stdNote"></p>
  <div class="twrap"><table>
    <thead><tr><th id="stdTh1"></th><th id="stdTh2"></th></tr></thead>
    <tbody id="stdBody"></tbody>
  </table></div>
</section>

<div id="secs"></div>

<section class="card" id="cross">
  <h2><span id="crossTitle"></span><span class="num" id="crossNum"></span></h2>
  <p class="sec-note" id="crossNote"></p>
  <div class="twrap"><table>
    <thead><tr><th id="crossTh1"></th><th id="crossTh2"></th></tr></thead>
    <tbody id="crossBody"></tbody>
  </table></div>
</section>

<section class="card tips" id="tips">
  <h2 id="tipsTitle"></h2>
  <p class="sec-note" id="tipsNote"></p>
  <ul id="tipsList"></ul>
</section>

</main>

<footer class="note">
  <p><strong id="footH"></strong><span id="footB"></span></p>
</footer>

</div>
<button id="totop">↑</button>

{n:['無糖綠茶','无糖绿茶','Unsweetened green tea'],t:['light'],d:['兒茶素；咖啡因低於咖啡','儿茶素；咖啡因低于咖啡','Catechins; less caffeine than coffee'],k:1,p:0,f:0,c:0}
];

/* ════ 工具 ════ */
function esc(s){
  if(s==null)return '';
  return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function ftext(f){
  var tagText=f.t.map(function(t2){return CAT[t2]?(CAT[t2].n[L]+' '+CAT[t2].sh[L]):'';}).join(' ');
  var ex=(f.x||[]).map(function(e){return e[0]+' '+e[1]+' '+xl(e[0])+' '+xv(e[1]);}).join(' ');
  return f.n.join(' ')+' '+tagText+' '+f.d[L]+' '+ex;
}
function chipsBrowse(tags,current){
  var pre=(L===2?'+':'＋');
  return tags.map(function(t2){
    return '<span class="chip'+(t2===current?'':' sub')+' c-'+t2+'">'+(t2===current?'':pre)+CAT[t2].sh[L]+'</span>';
  }).join('');
}
function chipsSolid(tags){
  return tags.map(function(t2){return '<span class="chip c-'+t2+'">'+CAT[t2].sh[L]+'</span>';}).join('');
}

/* ════ 營養小方塊 ════ */
function gu(n,u){return (n==null)?'<b>—</b>':'<b>'+n+'<u>'+u+'</u></b>';}
function tiles(f){
  var h='';
  if(f.u==='ml')h+='<span class="perml">'+t('perMl')+'</span>';
  h+='<span class="nb kcal"><i>'+t('tKcal')+'</i><b>'+f.k+'<u>kcal</u></b></span>'
   +'<span class="nb"><i>'+t('tProt')+'</i>'+gu(f.p,'g')+'</span>'
   +'<span class="nb"><i>'+t('tFat')+'</i>'+gu(f.f,'g')+'</span>'
   +'<span class="nb"><i>'+t('tCarb')+'</i>'+gu(f.c,'g')+'</span>';
  (f.x||[]).forEach(function(e){
    h+='<span class="nb ex"><i>'+esc(xl(e[0]))+'</i><b>'+esc(xv(e[1]))+'</b></span>';
  });
  return '<div class="nutri">'+h+'</div>';
}

/* ════ DOM 引用 ════ */
var q=document.getElementById('q'), countEl=document.getElementById('count'), body=document.body;
var state={sel:{},mode:'and',sort:'default'};
function selKeys(){return CAT_ORDER.filter(function(k){return state.sel[k];});}

/* ════ 類別多選按鈕（一次建立，換語言只更新文字） ════ */
var fbar=document.getElementById('fbar');
CAT_ORDER.forEach(function(k){
  var b=document.createElement('button');
  b.type='button'; b.className='fbtn c-'+k; b.setAttribute('data-k',k);
  b.style.setProperty('--c','var('+CAT[k].v+')');
  b.addEventListener('click',function(){ state.sel[k]=!state.sel[k]; syncBtns(); apply(); });
  fbar.appendChild(b);
});
function updateFbar(){
  [].forEach.call(fbar.querySelectorAll('.fbtn'),function(b){
    var k=b.getAttribute('data-k');

    b.innerHTML='<span>'+CAT[k].i+' '+CAT[k].sh[L]+'</span><span class="cnt">'+cnt+'</span>';
  });
}
function syncBtns(){
  [].forEach.call(fbar.querySelectorAll('.fbtn'),function(b){
    b.classList.toggle('on',!!state.sel[b.getAttribute('data-k')]);
  });
}

var modeAnd=document.getElementById('modeAnd'), modeOr=document.getElementById('modeOr');
function syncMode(){
  modeAnd.classList.toggle('on',state.mode==='and');
  modeOr.classList.toggle('on',state.mode==='or');
}
modeAnd.addEventListener('click',function(){state.mode='and';syncMode();apply();});
modeOr.addEventListener('click',function(){state.mode='or';syncMode();apply();});
var sortSel=document.getElementById('sort');
sortSel.addEventListener('change',function(){state.sort=sortSel.value;apply();});
function updateSort(){

/* ════ 全站渲染（換語言時重繪） ════ */

     +'<p class="sec-note">'+CAT[k].s[L]+'</p>'
     +'<div class="twrap"><table><thead><tr>'
     +'<th>'+t('thFood')+'</th><th>'+t('thAttr')+'</th><th>'+t('thDesc')+'</th><th>'+t('thVal')+'</th>'
     +'</tr></thead><tbody>';
    foods.forEach(function(f){
      html+='<tr><td class="food-name">'+esc(f.n[L])+'</td><td>'+chipsBrowse(f.t,k)
        +'</td><td>'+esc(f.d[L])+'</td><td>'+tiles(f)+'</td></tr>';
    });
    html+='</tbody></table></div></section>';

  document.getElementById('secs').innerHTML=html;
}

/* ════ 篩選系統 ════ */
function match(f){
  var rawKws=q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  var text=ftext(f).toLowerCase();
  var kwHit=!rawKws.length||rawKws.every(function(kw){return text.indexOf(kw)>-1;});
  var keys=selKeys(), catHit;
  if(!keys.length)catHit=true;
  else if(state.mode==='and')catHit=keys.every(function(k){return f.t.indexOf(k)>-1;});
  else catHit=keys.some(function(k){return f.t.indexOf(k)>-1;});
  return kwHit&&catHit;
}
function hl(name){
  var raw=q.value.trim();
  if(!raw)return esc(name);
  var kws=raw.split(/\s+/).filter(Boolean);
  var en=esc(name);
  kws.forEach(function(kw){
    var clean=esc(kw).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    if(!clean)return;
    try{ en=en.replace(new RegExp('('+clean+')','gi'),'<mark>$1</mark>'); }catch(e){}
  });
  return en;
}
function resChips(f){
  return f.t.map(function(t2){
    return '<span class="chip'+(state.sel[t2]?'':' sub')+' c-'+t2+'">'+CAT[t2].sh[L]+'</span>';
  }).join('');
}
function sortLabel(v){
  for(var i=0;i<SORTS.length;i++){ if(SORTS[i][0]===v)return SORTS[i][1+L]; }
  return '';
}

function apply(){
  var rawKw=q.value.trim();
  var on=selKeys().length>0 || rawKw!=='' || state.sort!=='default';
  document.getElementById('std').style.display=on?'none':'';
  document.getElementById('cross').style.display=on?'none':'';
  document.getElementById('tips').style.display=on?'none':'';
  [].forEach.call(document.querySelectorAll('section.card[id^="sec-"]'),function(s){
    s.style.display=on?'none':'';
  });
  var res=document.getElementById('results'),
      empty=document.getElementById('empty'),
      emptyTxt=document.getElementById('emptyTxt'),
      tryOr=document.getElementById('tryOr'),
      resTwrap=document.getElementById('resTwrap'),
      tbody=document.getElementById('resBody');

  if(!on){
    res.style.display='none';
    countEl.textContent=t('total')+F.length+t('items');
    return;
  }

  var list=F.filter(match);
  if(state.sort==='name'){
    list.sort(function(a,b){return a.n[L].localeCompare(b.n[L],LOC[L]);});
  }else if(state.sort==='tags'){
    list.sort(function(a,b){return (b.t.length-a.t.length)||a.n[L].localeCompare(b.n[L],LOC[L]);});
  }else if(state.sort==='kcalA'){
    list.sort(function(a,b){return (a.k-b.k)||a.n[L].localeCompare(b.n[L],LOC[L]);});
  }else if(state.sort==='kcalD'){
    list.sort(function(a,b){return (b.k-a.k)||a.n[L].localeCompare(b.n[L],LOC[L]);});
  }else if(state.sort==='prot'){
    list.sort(function(a,b){return ((b.p||0)-(a.p||0))||a.n[L].localeCompare(b.n[L],LOC[L]);});
  }

  var keys=selKeys();
  var cond=keys.length?keys.map(function(k){return CAT[k].i+' '+CAT[k].n[L];})
    .join(t(state.mode==='and'?'andJoin':'orJoin'))
    +(keys.length>1?t(state.mode==='and'?'needAll':'anyOk'):''):'';
  var kwTxt=rawKw?(t('kw')+esc(rawKw)+t('kwEnd')):'';
  var sortTxt=state.sort!=='default'?sortLabel(state.sort):'';
  document.getElementById('resDesc').innerHTML=[cond,kwTxt,sortTxt].filter(Boolean).join(' ・ ')||t('resAll');
  document.getElementById('resNum').textContent=list.length+t('items');

  if(list.length){
    tbody.innerHTML=list.map(function(f){
      return '<tr><td class="food-name">'+hl(f.n[L])+'</td><td>'+resChips(f)
        +'</td><td>'+esc(f.d[L])+'</td><td>'+tiles(f)+'</td></tr>';
    }).join('');
    resTwrap.style.display='';
    empty.style.display='none';
  }else{
    tbody.innerHTML='';
    resTwrap.style.display='none';
    empty.style.display='';
    if(state.mode==='and' && keys.length>1){
      emptyTxt.textContent=t('emptyAnd');
      tryOr.style.display='';
    }else{
      emptyTxt.textContent=t('emptyNone');
      tryOr.style.display='none';
    }
  }
  res.style.display='';
  countEl.textContent=t('found')+list.length+t('items');
}

q.addEventListener('input',apply);
q.addEventListener('search',apply);

function resetAll(){
  q.value='';
  state.sel={};
  state.sort='default';
  sortSel.value='default';
  syncBtns();
  apply();
}
document.getElementById('reset').addEventListener('click',function(){ resetAll(); q.focus(); });
document.getElementById('tryOr').addEventListener('click',function(){
  state.mode='or'; syncMode(); apply();
});
document.getElementById('pills').addEventListener('click',function(e){
  var a=e.target.closest('a');
  if(!a)return;
  var targetId=a.getAttribute('href');
  var wasFiltered=selKeys().length>0 || q.value.trim()!=='' || state.sort!=='default';
  if(wasFiltered){
    resetAll();
    if(targetId && targetId.startsWith('#')){
      setTimeout(function(){
        var el=document.querySelector(targetId);
        if(el)el.scrollIntoView({behavior:'smooth'});
      },20);
    }
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='/' && document.activeElement!==q){ e.preventDefault(); q.focus(); }
  if(e.key==='Escape'){ resetAll(); q.blur(); }
});

/* ════ 語言切換 ════ */
function syncLangBtns(){
  [].forEach.call(document.querySelectorAll('#langSeg button'),function(b){
    b.classList.toggle('on',parseInt(b.getAttribute('data-l'),10)===L);
  });
}
document.getElementById('langSeg').addEventListener('click',function(e){
  var b=e.target.closest('button');
  if(!b)return;
  var nl=parseInt(b.getAttribute('data-l'),10);
  if(nl===L)return;
  L=nl;
  try{localStorage.setItem('foodlang',String(L));}catch(e2){}
  syncLangBtns();
  renderAll();
  apply();
});

try{savedLang=localStorage.getItem('foodlang');}catch(e){}
if(savedLang==='1'||savedLang==='2'||savedLang==='0')L=parseInt(savedLang,10);

/* ════ 深色模式／回頂端 ════ */
var themeBtn=document.getElementById('theme');
function setTheme(d,save){
  body.classList.toggle('dark',d);
  themeBtn.textContent=d?'☀️':'🌙';
  if(save){ try{localStorage.setItem('foodtheme',d?'dark':'light');}catch(e){} }
}

try{savedTheme=localStorage.getItem('foodtheme');}catch(e){}
if(savedTheme==='dark'||(!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)){
  setTheme(true,false);
}

window.addEventListener('scroll',function(){
  totopBtn.style.display=(window.scrollY||document.documentElement.scrollTop)>400?'block':'none';
},{passive:true});
totopBtn.addEventListener('click',function(){ window.scrollTo({top:0,behavior:'smooth'}); });
})();
